name: emb_gallery
description: Tarik emb - Embroidery Files Viewer and Manager
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.3
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  intl: ^0.19.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/emb_fonts/
