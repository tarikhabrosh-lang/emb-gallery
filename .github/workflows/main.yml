name: Build Tarik emb APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK to Tarik_emb.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Tarik_emb.apk

      - name: Upload Tarik_emb APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarik_emb_APK
          path: build/app/outputs/flutter-apk/Tarik_emb.apk
