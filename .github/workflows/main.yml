name: Build Tarik emb APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Backup custom files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          if [ -d scripts ]; then cp -r scripts /tmp/backup/; fi
          if [ -d assets ]; then cp -r assets /tmp/backup/; fi

      - name: Recreate clean Android project
        run: |
          rm -rf android ios web linux macos windows test build pubspec.lock
          flutter create --org com.tarikhabrosh --project-name emb_gallery --platforms=android .
          rm -rf lib
          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          if [ -d /tmp/backup/scripts ]; then cp -r /tmp/backup/scripts .; fi
          if [ -d /tmp/backup/assets ]; then cp -r /tmp/backup/assets .; fi

      - name: Fix Kotlin version and compileSdk 35
        run: |
          python3 -c '
          import glob, re
          for p in glob.glob("android/settings.gradle*"):
              s = open(p).read()
              s = re.sub(r"(id\s+[\"'\'']org\.jetbrains\.kotlin\.android[\"'\'']\s+version\s+[\"'\''])[^\"'\'']+([\"'\''])", r"\g<1>2.0.20\g<2>", s)
              open(p, "w").write(s)
          for p in glob.glob("android/build.gradle*"):
              s = open(p).read()
              s = re.sub(r"ext\.kotlin_version\s*=\s*[\"'\''][^\"'\'']+[\"'\'']", "ext.kotlin_version = \"2.0.20\"", s)
              open(p, "w").write(s)
          for p in glob.glob("android/app/build.gradle*"):
              s = open(p).read()
              s = re.sub(r"compileSdk\s*=?\s*[\w\.]+", "compileSdk = 35", s)
              s = re.sub(r"compileSdkVersion\s+[\w\.]+", "compileSdkVersion 35", s)
              s = re.sub(r"targetSdk\s*=?\s*[\w\.]+", "targetSdk = 35", s)
              s = re.sub(r"minSdk\s*=?\s*[\w\.]+", "minSdk = 21", s)
              open(p, "w").write(s)
          '

      - name: Configure Tarik emb name, icon, and WhatsApp EMB association
        run: python3 scripts/configure_android.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK to Tarik_emb.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Tarik_emb.apk

      - name: Upload Tarik_emb APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarik_emb_APK
          path: build/app/outputs/flutter-apk/Tarik_emb.apk
