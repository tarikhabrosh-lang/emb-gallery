name: Build Tarik emb APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Backup custom files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          if [ -d assets ]; then cp -r assets /tmp/backup/; fi

      - name: Initialize Android project files
        run: |
          flutter create --org com.tarikhabrosh --project-name emb_gallery .
          rm -rf lib
          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          if [ -d /tmp/backup/assets ]; then cp -r /tmp/backup/assets .; fi

      - name: Configure Tarik emb name and app launcher icon from assets/logo.png
        run: |
          python3 - << 'EOF'
          import os, re, shutil

          # 1. Update AndroidManifest.xml app label and intent filters
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()

          manifest = re.sub(r'android:label="[^"]*"', 'android:label="Tarik emb"', manifest, count=1)

          emb_intent_filters = """
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="content" />
                <data android:scheme="file" />
                <data android:mimeType="*/*" />
                <data android:pathPattern=".*\\.emb" />
                <data android:pathPattern=".*\\.EMB" />
            </intent-filter>
          """
          if "android.intent.action.VIEW" not in manifest:
              manifest = manifest.replace("</activity>", emb_intent_filters + "\n        </activity>", 1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)

          # 2. Setup MainActivity.kt for WhatsApp intent opening
          kt_dir = "android/app/src/main/kotlin/com/tarikhabrosh/emb_gallery"
          os.makedirs(kt_dir, exist_ok=True)
          kt_code = """package com.tarikhabrosh.emb_gallery

import android.content.Intent
import android.net.Uri
import android.os.Bundle
import android.provider.OpenableColumns
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel
import java.io.File
import java.io.FileOutputStream

class MainActivity : FlutterActivity() {
    private val CHANNEL = "tarik_emb/file_intent"
    private var initialFilePath: String? = null
    private var methodChannel: MethodChannel? = null

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        handleIntent(intent, isInitial = true)
    }

    override fun onNewIntent(intent: Intent) {
        super.onNewIntent(intent)
        setIntent(intent)
        handleIntent(intent, isInitial = false)
    }

    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
        methodChannel?.setMethodCallHandler { call, result ->
            if (call.method == "getInitialFile") {
                result.success(initialFilePath)
                initialFilePath = null
            } else {
                result.notImplemented()
            }
        }
    }

    private fun handleIntent(intent: Intent?, isInitial: Boolean) {
        if (intent?.action == Intent.ACTION_VIEW) {
            val uri: Uri = intent.data ?: return
            val copiedPath = copyUriToCache(uri) ?: return
            if (isInitial) {
                initialFilePath = copiedPath
            } else {
                methodChannel?.invokeMethod("onFileOpened", copiedPath)
            }
        }
    }

    private fun copyUriToCache(uri: Uri): String? {
        return try {
            var displayName = "design.emb"
            contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                let nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                if (nameIndex >= 0 && cursor.moveToFirst()) {
                    val name = cursor.getString(nameIndex)
                    if (!name.isNullOrBlank()) displayName = name
                }
            }
            if (!displayName.lowercase().endsWith(".emb")) displayName = "$displayName.emb"
            val outDir = File(cacheDir, "incoming_emb")
            if (!outDir.exists()) outDir.mkdirs()
            val outFile = File(outDir, displayName)
            contentResolver.openInputStream(uri)?.use { input ->
                FileOutputStream(outFile).use { output -> input.copyTo(output) }
            }
            outFile.absolutePath
        } catch (e: Exception) {
            null
        }
    }
}
"""
          with open(os.path.join(kt_dir, "MainActivity.kt"), "w", encoding="utf-8") as f:
              f.write(kt_code)

          # 3. Apply assets/logo.png as app launcher icon
          if os.path.exists("assets/logo.png"):
              for folder in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
                  dest_dir = f"android/app/src/main/res/{folder}"
                  if os.path.exists(dest_dir):
                      shutil.copy("assets/logo.png", os.path.join(dest_dir, "ic_launcher.png"))
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK to Tarik_emb.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Tarik_emb.apk

      - name: Upload Tarik_emb APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarik_emb_APK
          path: build/app/outputs/flutter-apk/Tarik_emb.apk
